name: Report a bug
description: Describe a reproducible bug in the Luminovia Portal.
title: "[Bug]: "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. First check whether a matching issue already exists.
        Use fictional or redacted examples only. Do not post passwords, tokens, MFA codes,
        private documents or personal customer data.
        Report security vulnerabilities through the [private GitHub channel](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/security/advisories/new).
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Commit SHA, release tag or date of the affected version. If you do not know, explicitly write "unknown".
      placeholder: "For example: commit abc1234, local branch codex/example"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development with ./portal start
        - Isolated test with ./portal test
        - Self-hosted development instance
        - Other or unknown environment
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Operating system and browser
      description: For browser issues, include the browser name, version and device. For API or CLI issues, list the tools used.
      placeholder: "For example: Linux, Chromium 140, desktop; language EN, dark theme"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the starting state, affected page or API, required role and exact steps. Do not include credentials.
      placeholder: |
        1. Sign in with a fictional lecturer account.
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen after these steps?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Does the problem occur consistently or only occasionally?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence and additional context
      description: Optionally include screenshots, the exact error message or short redacted logs. For calendar issues, include the date and IANA time zone. Do not upload complete private network traces.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched for existing issues.
          required: true
        - label: This report contains no credentials, private documents or personal data. I will report security vulnerabilities through the private channel described above.
          required: true
