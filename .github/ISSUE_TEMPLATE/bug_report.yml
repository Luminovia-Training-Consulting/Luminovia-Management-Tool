name: Bug report
description: Describe a reproducible problem in Luminovia Portal.
title: "[Bug]: "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues before reporting a problem.
        Use fictional or redacted examples only. Do not post passwords,
        tokens, MFA codes, private documents or personal customer data.
        Report vulnerabilities through the [private process in the issue guide](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/blob/main/docs/ISSUE_GUIDE.md#reporting-security-issues).
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Commit SHA, release tag or date of the observed version. Explicitly state "unknown" if unavailable.
      placeholder: "For example: commit abc1234, local branch codex/example"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development with ./portal start
        - Isolated test with ./portal test
        - Self-hosted development instance
        - Other or unknown environment
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Operating system and browser
      description: For browser defects, include browser name, version and device; for API/CLI defects, identify the tools used.
      placeholder: "For example: Linux, Chromium 140, desktop; language DE, dark theme"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe initial state, affected page or API, required role and exact steps. Do not include credentials.
      placeholder: |
        1. Sign in with a fictional lecturer account.
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen after these steps?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behaviour
      description: What happens instead? Is the problem reproducible or intermittent?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised evidence and context
      description: Optionally include screenshots, exact errors or short sanitised logs. Include date and IANA time zone for calendar problems. Do not upload complete private network captures.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no credentials, private documents or personal data; I will report vulnerabilities through the private process.
          required: true
