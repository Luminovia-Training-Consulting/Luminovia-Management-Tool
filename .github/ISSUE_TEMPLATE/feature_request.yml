name: Funktion vorschlagen
description: Ein Problem und eine überprüfbare Verbesserung für das Luminovia Portal beschreiben.
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe zuerst das Problem und den tatsächlichen Arbeitsablauf.
        Prüfe den [bestehenden Produktplan](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/blob/main/docs/IMPLEMENTATION_PLAN.md)
        und vorhandene Issues. Ein Vorschlag ist noch keine Zusage zur Umsetzung oder Produktionsfreigabe.
  - type: textarea
    id: problem
    attributes:
      label: Problem und betroffene Personen
      description: Wer möchte welche Aufgabe erledigen und woran scheitert das bisher?
      placeholder: "Als … möchte ich …, damit …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Gewünschtes Verhalten
      description: Beschreibe den Ablauf und das sichtbare Ergebnis. Fiktive Beispiele helfen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Überprüfbare Akzeptanzkriterien
      description: Welche konkreten Beobachtungen zeigen, dass die Funktion richtig arbeitet? Berücksichtige Fehler-, Leer- und Berechtigungsfälle, soweit relevant.
      placeholder: |
        - Wenn …, dann …
        - Ein Konto ohne … darf … nicht sehen oder ändern.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Rollen, Daten und Sichtbarkeit
      description: Welche Rollen dürfen die Funktion nutzen? Welche Daten bleiben privat? Falls keine Änderung an Berechtigungen nötig ist, bitte so angeben.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen und vorhandene Funktionen
      description: Welche bisherigen Funktionen oder anderen Abläufe wurden geprüft? Verlinke verwandte Issues oder den passenden Eintrag im Produktplan.
  - type: textarea
    id: context
    attributes:
      label: Weitere Hinweise
      description: Optional Skizzen, Barrierefreiheit, DE/EN, Mobilansicht, Zeitzonen oder Leistungsanforderungen. Keine realen Kundendaten oder privaten Dokumente anhängen.
  - type: checkboxes
    id: checks
    attributes:
      label: Vor dem Absenden
      options:
        - label: Ich habe nach bestehenden Issues und dem passenden Eintrag im Produktplan gesucht.
          required: true
        - label: Die Beispiele und Anhänge enthalten keine Geheimnisse oder personenbezogenen Daten.
          required: true
