name: Suggest a feature
description: Describe a problem and a verifiable improvement for the Luminovia Portal.
title: "[Feature]: "
labels: [ "type:feature" ]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem and the actual workflow.
        Check the [product roadmap](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/blob/main/ROADMAP.md)
        and existing issues. A suggestion does not promise implementation or authorize a production release.
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected users
      description: Who is trying to complete which task, and what currently prevents them from doing so?
      placeholder: "As a ..., I want to ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
      description: Describe the workflow and visible result. Fictional examples are helpful.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
      description: What concrete observations would show that the feature works correctly? Include error, empty and permission cases where relevant.
      placeholder: |
        - When ..., then ...
        - An account without ... must not see or change ...
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Roles, data and visibility
      description: Which roles may use the feature? Which data must remain private? If no permission changes are needed, say so.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and existing features
      description: Which existing features or other workflows have you considered? Link related issues or the relevant product-plan entry.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optionally include sketches, accessibility, DE/EN, mobile layouts, time zones or performance requirements. Do not attach real customer data or private documents.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and the relevant product-plan entry.
          required: true
        - label: My examples and attachments contain no secrets or personal data.
          required: true