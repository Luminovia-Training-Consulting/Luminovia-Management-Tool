name: Feature request
description: Describe a problem and a verifiable improvement for Luminovia Portal.
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem and actual workflow first.
        Check the [existing product plan](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/blob/main/docs/IMPLEMENTATION_PLAN.md)
        and existing issues. A proposal does not promise implementation or production approval.
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected people
      description: Who needs to do what, and what prevents them from doing it today?
      placeholder: "As a ... I want to ... so that ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behaviour
      description: Describe the workflow and visible result. Fictional examples help.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
      description: Which observations demonstrate correct behaviour? Include relevant error, empty and permission cases.
      placeholder: |
        - When ..., then ...
        - An account without ... cannot view or change ...
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Roles, data and visibility
      description: Which roles can use this feature? Which data stays private? State explicitly if no permission change is needed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and existing features
      description: Which existing features or alternative workflows were considered? Link related issues or the relevant product-plan entry.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optionally include sketches, accessibility, DE/EN, mobile, time zones or performance needs. Do not attach real customer data or private documents.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the relevant product-plan entry.
          required: true
        - label: Examples and attachments contain no secrets or personal data.
          required: true
