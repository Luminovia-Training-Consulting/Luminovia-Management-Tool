name: Question
description: Ask a specific development, usage or documentation question.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/blob/main/CONTRIBUTING.md)
        and the [issue guide](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/blob/main/docs/ISSUE_GUIDE.md) first.
        Do not post credentials, tokens, MFA codes, private documents or real personal/customer data.
        Report suspected vulnerabilities through [GitHub private vulnerability reporting](https://github.com/Luminovia-Training-Consulting/Luminovia-Management-Tool/security/advisories/new).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Which specific information is missing? Describe the intended result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and information already checked
      description: Link the affected guide or feature and explain what you already read or tried. Use fictional or sanitised examples only.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or environment (optional)
      description: Include commit, development release, browser or local environment where relevant; no credentials.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing documentation and issues for an answer.
          required: true
        - label: My information and attachments contain no secrets, private documents or personal data.
          required: true
