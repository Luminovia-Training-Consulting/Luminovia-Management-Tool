# Publish a complete immutable application package only after current main's
# application and security workflows pass. The VPS independently validates
# archive, migration, backup, health and rollback safety before activation.
name: Automatic CMS release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: automatic-main-cms-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Luminovia-Training-Consulting/Luminovia-Management-Tool' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: cms-release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify current main and wait for complete CI and security checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Luminovia-Training-Consulting/Luminovia-Management-Tool
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT_SHA="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if test "$TARGET_SHA" != "$CURRENT_SHA"; then
            echo 'A newer main exists; do not publish this revision.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in $(seq 1 120); do
            RUNS="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
            ALL_SUCCESS=true
            for WORKFLOW in 'Portal checks' 'Security analysis'; do
              STATE="$(jq -r --arg sha "$TARGET_SHA" --arg workflow "$WORKFLOW" '
                [.workflow_runs[] | select(
                  .head_sha == $sha and .event == "push" and
                  .head_branch == "main" and .name == $workflow
                )] | sort_by(.created_at) | last // {} |
                [.status // "missing", .conclusion // ""] | @tsv
              ' <<< "$RUNS")"
              IFS=$'\t' read -r STATUS CONCLUSION <<< "$STATE"
              if test "$STATUS" = completed; then
                if test "$CONCLUSION" != success; then
                  echo "$WORKFLOW did not pass for $TARGET_SHA (conclusion: $CONCLUSION)." >&2
                  exit 1
                fi
                echo "$WORKFLOW passed for $TARGET_SHA."
              else
                ALL_SUCCESS=false
                echo "Waiting for $WORKFLOW ($STATUS) on $TARGET_SHA."
              fi
            done
            if test "$ALL_SUCCESS" = true; then
              CURRENT_SHA="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
              if test "$TARGET_SHA" != "$CURRENT_SHA"; then
                echo 'Main advanced while CI was running; do not publish this revision.'
                echo 'publish=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo 'publish=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo 'Timed out waiting for complete application and security checks.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify the trusted checkout before running repository code
        id: source
        if: steps.gate.outputs.publish == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if test "$(git rev-parse HEAD)" != "$TARGET_SHA"; then
            echo 'Main advanced before checkout. The newer revision has its own release build.'
            exit 0
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.source.outputs.verified == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.source.outputs.verified == 'true'
        run: npm ci
      - name: Typecheck and build the current main release
        if: steps.source.outputs.verified == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ vars.CMS_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CMS_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm run build
          node deploy/hostinger/updates/package.mjs --commit "$TARGET_SHA" --output "$RUNNER_TEMP/cms-release"
      - name: Publish immutable release for still-current main
        if: steps.source.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Luminovia-Training-Consulting/Luminovia-Management-Tool
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"
          RELEASE_TAG="cms-dev-$TARGET_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/cms-existing-release.json" 2>/dev/null; then
            if test "$(jq -r .isDraft "$RUNNER_TEMP/cms-existing-release.json")" = false; then
              echo 'The immutable release is already published.'
              exit 0
            fi
            echo 'An existing draft requires operator inspection; it will not be overwritten.' >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" --target "$TARGET_SHA" --draft --prerelease --title "CMS development $TARGET_SHA" --notes 'Automatically published from the exact current main revision. The VPS validates the immutable package and migration safety before applying it.'
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/cms-release/cms-release.tar.gz" "$RUNNER_TEMP/cms-release/cms-release.json"
          gh release edit "$RELEASE_TAG" --draft=false
