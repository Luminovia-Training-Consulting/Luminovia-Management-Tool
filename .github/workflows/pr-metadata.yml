# Labels werden als Daten aus der API gelesen, niemals als Shell-Programm ausgeführt.
name: Pull request metadata
on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        reopened,
        synchronize,
        labeled,
        unlabeled,
        edited,
        ready_for_review,
      ]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Standard PR code is untrusted. This job has only read access, no secrets,
      # package installation or write operation; workflow edits need human review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check current PR labels as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-metadata.mjs
