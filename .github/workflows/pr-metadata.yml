# Read labels from the API as data; never execute them as shell commands.
name: Pull request metadata
run-name: "PR #${{ github.event.pull_request.number || inputs.pull_request_number }} metadata"
on:
  pull_request:
    branches: [ main ]
    types:
      [
        opened,
        reopened,
        synchronize,
        labeled,
        unlabeled,
        edited,
        ready_for_review,
      ]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Recheck current labels of an existing PR using the main catalogue
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true
jobs:
  metadata:
    name: PR metadata
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.state == 'open') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Only trusted default-branch code runs, including for forks. Never
      # check out a contribution ref here. PR metadata is input data only;
      # no package installation, repository secrets or write permissions belong here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Luminovia-Training-Consulting/Luminovia-Management-Tool
          ref: refs/heads/main
          persist-credentials: false
      - name: Check current PR labels as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-metadata.mjs