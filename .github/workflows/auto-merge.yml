# Trusted-main controller for protected native PR merges after complete evidence.
# The App has no CI/review bypass and receives no PR-controlled executable input.
name: Verified automatic merge
on:
  workflow_run:
    workflows: [Portal checks, Security analysis, Pull request metadata]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Recheck delayed CodeQL findings without requiring another PR code push.
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read
  security-events: read
concurrency:
  group: verified-automatic-merge
  cancel-in-progress: false
jobs:
  preflight:
    name: Find pending main or pull request work
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has_work: ${{ steps.work.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Check exact main and open pull requests with the read token
        id: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          has_work="$(node scripts/pr-auto-merge.mjs --has-work)"
          case "$has_work" in true|false) ;; *) exit 1 ;; esac
          printf 'has_work=%s\n' "$has_work" >> "$GITHUB_OUTPUT"
  merge:
    needs: preflight
    if: needs.preflight.outputs.has_work == 'true'
    environment:
      name: maintenance-signing
      # Reuse protected credentials without creating automatic deployments.
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged workflow: execute only trusted default-branch code. Never
      # restore PR artifacts/caches, install packages, or check out a PR revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Check protected merge App configuration
        id: app
        env:
          APP_ID: ${{ vars.MAINTENANCE_APP_ID }}
          APP_KEY: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if test -z "$APP_ID" && test -z "$APP_KEY" && test "$EVENT_NAME" != workflow_dispatch; then
            echo 'Configure the protected GitHub App before enabling automatic merges.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$APP_ID" = "5776881"
          test -n "$APP_KEY"
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - name: Create a repository-scoped native merge token
        id: promotion
        if: steps.app.outputs.configured == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: write
      - name: Verify the existing App identity
        if: steps.app.outputs.configured == 'true'
        env:
          APP_SLUG: ${{ steps.promotion.outputs.app-slug }}
        run: test "$APP_SLUG" = "luminovia-portal-maintenance"
      - name: Merge only completely verified current pull requests
        if: steps.app.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_TOKEN: ${{ steps.promotion.outputs.token }}
        run: node scripts/pr-auto-merge.mjs --apply
