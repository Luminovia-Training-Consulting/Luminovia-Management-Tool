# Main acceptance: fast quality gates, the real isolated application, then
# actual selfhost images. Only a successful main revision is packaged.
name: Portal checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main revision promoted by daily maintenance
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: portal-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  quality:
    # Independent diagnostics remain visible when another gate fails.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            command: npm run build
          - name: Typecheck
            command: npm run typecheck
          - name: Lint
            command: npm run lint
          - name: Formatting
            command: npm run format:check && npx prettier --check .github
          - name: Code quality
            command: node scripts/code-integrity.mjs --exports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.name }}
        # Public, fictional build values; PRs need no repository configuration.
        env:
          VITE_SUPABASE_URL: https://ci.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fictional_build_only
        run: ${{ matrix.command }}
  coverage:
    # Unit/component coverage is separate from SQL and browser acceptance.
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Check unit tests and coverage thresholds
        id: coverage
        run: npm run test:coverage
      - name: Upload inspectable coverage reports
        if: always() && steps.coverage.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
  verify:
    # The canonical local command owns its data/ports and verifies cleanup.
    needs: [quality, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify explicitly requested revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test -z "$EXPECTED_COMMIT" || test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Install official backup encryption test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Complete isolated local verification
        run: ./portal test
      - name: Preserve actual functional and integration acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-functional-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/tests/*/acceptance.json
          if-no-files-found: error
          retention-days: 14
  verify-selfhost:
    # HEAD^ supplies the previous source contract for a real retained-data upgrade;
    # successful mocks/unit tests do not replace this container run.
    name: Actual isolated selfhost image compatibility
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Archive previous committed runtime for retained-data upgrade check
        run: |
          mkdir -m 700 "$RUNNER_TEMP/selfhost-baseline"
          git archive HEAD^ | tar -x -C "$RUNNER_TEMP/selfhost-baseline"
      - run: node deploy/hostinger/maintenance/selfhost-candidate-check.mjs --run --baseline-root "$RUNNER_TEMP/selfhost-baseline" --baseline-commit "$(git rev-parse HEAD^)" --proof-output "$RUNNER_TEMP/postgres-candidate-proof.json"
  release-cms:
    # Development release with an immutable commit tag. This gate depends on all
    # application gates, including after a direct maintainer merge.
    name: Publish tested CMS update
    needs: [quality, coverage, verify, verify-selfhost]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Build public frontend and verified release package
        env:
          VITE_SUPABASE_URL: ${{ vars.CMS_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CMS_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm run build
          node deploy/hostinger/updates/package.mjs --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/cms-release"
      - name: Publish immutable update after verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Luminovia-Training-Consulting/Luminovia-Management-Tool
        run: |
          set -euo pipefail
          RELEASE_TAG="cms-dev-$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/cms-existing-release.json" 2>/dev/null; then
            if test "$(jq -r .isDraft "$RUNNER_TEMP/cms-existing-release.json")" = false; then
              echo "The immutable release is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "CMS development $GITHUB_SHA" --notes "Automatically built from a successfully verified main commit."
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/cms-release/cms-release.tar.gz" "$RUNNER_TEMP/cms-release/cms-release.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
