# Scope only reduces verified Draft UI/docs work. Ready PRs, backend/auth/delivery
# changes and all main/manual runs retain complete acceptance; uncertain is full.
# Every release still requires explicit exact-main approval and complete gates.
name: Portal checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main SHA to verify; required when publishing a release
        required: false
        type: string
      publish_release:
        description: Publish this exact verified main revision for the CMS development updater
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  # A manual acceptance run is evidence for a specific commit. A later push
  # must not cancel it while the native browser reports are still being written.
  group: portal-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.sha) || '' }}
  cancel-in-progress: true
jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the exact merge result conservatively
        id: scope
        run: node scripts/ci-change-scope.mjs
  quality:
    # Independent diagnostics remain visible when another gate fails.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only metadata reads, including the continuous exact source-push probe.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
      security-events: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            # Typecheck runs beside this job; npm run build would execute tsc -b again.
            command: npm run build:quality
          - name: Typecheck
            command: npm run typecheck
          - name: Lint
            command: npm run lint
          - name: Formatting
            command: npm run format:check && npx prettier --check .github
          - name: Code quality
            command: node scripts/code-integrity.mjs --exports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Verify read-only source metadata access
        if: matrix.name == 'Code quality'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-auto-merge.mjs --probe-source "$GITHUB_RUN_ID"
      - name: Run ${{ matrix.name }}
        # Public, fictional build values; PRs need no repository configuration.
        env:
          VITE_SUPABASE_URL: https://ci.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fictional_build_only
        run: ${{ matrix.command }}
  coverage:
    # Unit/component coverage is separate from SQL and browser acceptance.
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Check unit tests and coverage thresholds
        id: coverage
        run: npm run test:coverage
      - name: Upload inspectable coverage reports
        if: always() && steps.coverage.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
  verify:
    # Draft UI/docs may use bounded checks. Ready/sensitive PRs retain complete
    # system and browser phases on separate owned runners; main/manual runs all.
    needs: scope
    # A broken scope job must fail this required gate instead of skipping it.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # Earlier complete acceptance took 38m53s; PR17 reached browsers after 31m.
    # Keep room for Main/manual all-phase work; individual deadlines stay fixed.
    timeout-minutes: 60
    steps:
      - name: Require a successful recognized scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_ACTION: ${{ github.event.action }}
          PROFILE: ${{ needs.scope.outputs.profile }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$PROFILE" in docs|standard|full) ;; *) exit 1 ;; esac
          if test "$EVENT_NAME" != pull_request; then test "$PROFILE" = full; fi
          if test "$EVENT_NAME" = pull_request; then
            if test "$PR_DRAFT" != true || test "$PR_ACTION" = ready_for_review; then test "$PROFILE" = full; fi
          fi
      - name: Verify explicitly requested revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test -z "$EXPECTED_COMMIT" || test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: PR runtime, Edge and dependency checks
        if: needs.scope.outputs.profile != 'full'
        run: node scripts/ci-pr-check.mjs guards
      - name: Install official backup encryption test dependency
        if: needs.scope.outputs.profile == 'full'
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Complete isolated local verification
        id: application
        if: needs.scope.outputs.profile == 'full'
        run: |
          node scripts/runtime-test.mjs --phase system --external-gates quality,coverage
      - name: Preserve actual functional and integration acceptance
        if: always() && (steps.application.outcome == 'success' || steps.application.outcome == 'failure' || steps.application.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-functional-acceptance-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/tests/*/acceptance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify-browser:
    name: Isolated browser acceptance (${{ matrix.browser-project }})
    needs: scope
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        browser-project: [desktop-chromium, mobile-chromium]
    # Match the verified WebKit host. Browser dependencies stalled on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    # The serial application suite reached its 45-minute limit on hosted
    # desktop runners. Allow its full run plus both PWA and artifact stages.
    timeout-minutes: 90
    env:
      PORTAL_BROWSER_PROJECT: ${{ matrix.browser-project }}
    steps:
      - name: Require a successful recognized scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_ACTION: ${{ github.event.action }}
          PROFILE: ${{ needs.scope.outputs.profile }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$PROFILE" in docs|standard|full) ;; *) exit 1 ;; esac
          if test "$EVENT_NAME" != pull_request; then test "$PROFILE" = full; fi
          if test "$EVENT_NAME" = pull_request; then
            if test "$PR_DRAFT" != true || test "$PR_ACTION" = ready_for_review; then test "$PROFILE" = full; fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.profile == 'full'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.scope.outputs.profile == 'full'
        with:
          node-version-file: ".node-version"
          cache: npm
      - if: needs.scope.outputs.profile == 'full'
        run: npm ci
      - name: Install native browser libraries
        if: needs.scope.outputs.profile == 'full'
        timeout-minutes: 10
        run: |
          # The runner's regional HTTP mirror stalled while fetching WebKit dependencies.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          if test "$PORTAL_BROWSER_PROJECT" = desktop-chromium; then
            npx --no-install playwright install-deps chromium webkit
          else
            npx --no-install playwright install-deps chromium
          fi
      - name: Complete isolated browser acceptance
        id: browser
        if: needs.scope.outputs.profile == 'full'
        env:
          PORTAL_BROWSER_SYSTEM_DEPS_READY: "1"
        run: node scripts/runtime-test.mjs --phase browser
      - name: Preserve actual functional and integration acceptance
        if: always() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure' || steps.browser.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-functional-acceptance-browser-${{ matrix.browser-project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/tests/*/acceptance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve fictional browser failure context
        if: always() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-browser-failure-context-${{ matrix.browser-project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/tests/*/browser/application/results/**/error-context.md
            .local/tests/*/browser/application/results/**/test-failed-*.png
            .local/tests/*/browser/pwa/results/**/error-context.md
            .local/tests/*/browser/pwa/results/**/test-failed-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Explain bounded PR verification
        if: needs.scope.outputs.profile != 'full'
        run: echo 'The selected docs/standard profile does not claim browser acceptance; the final gate still requires its applicable checks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fictional feature screenshots
        if: always() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-course-building-blocks-${{ matrix.browser-project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/tests/*/screenshots/*-course-building-blocks-*.png
            .local/tests/*/screenshots/*-withdrawal-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  verify-selfhost:
    # Two PR SQL workers own separate pinned networkless clusters; docs-only
    # Draft changes explicitly require no SQL. Ready/sensitive PRs/main/manual
    # verify the complete native upgrade, independent of full application QA.
    name: Actual isolated selfhost image compatibility
    needs: scope
    # A broken scope job must fail this required gate instead of skipping it.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require a successful recognized scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_ACTION: ${{ github.event.action }}
          PROFILE: ${{ needs.scope.outputs.profile }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$PROFILE" in docs|standard|full) ;; *) exit 1 ;; esac
          if test "$EVENT_NAME" != pull_request; then test "$PROFILE" = full; fi
          if test "$EVENT_NAME" = pull_request; then
            if test "$PR_DRAFT" != true || test "$PR_ACTION" = ready_for_review; then test "$PROFILE" = full; fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.scope.outputs.profile != 'docs'
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: needs.scope.outputs.profile != 'docs'
        with:
          node-version-file: ".node-version"
          cache: npm
      - if: needs.scope.outputs.profile != 'docs'
        run: npm ci
      - name: PR isolated PostgreSQL migration, permissions and concurrency checks
        if: github.event_name == 'pull_request' && needs.scope.outputs.profile != 'docs'
        run: node scripts/ci-pr-check.mjs sql
      - name: Explain documentation-only verification
        if: needs.scope.outputs.profile == 'docs'
        run: echo 'Documentation-only merge; source/runtime/security gates run, SQL and native acceptance are not claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive previous committed runtime for retained-data upgrade check
        if: needs.scope.outputs.profile == 'full'
        run: |
          mkdir -m 700 "$RUNNER_TEMP/selfhost-baseline"
          git archive HEAD^ | tar -x -C "$RUNNER_TEMP/selfhost-baseline"
      - name: Complete isolated native selfhost verification
        if: needs.scope.outputs.profile == 'full'
        run: node deploy/hostinger/maintenance/selfhost-candidate-check.mjs --run --baseline-root "$RUNNER_TEMP/selfhost-baseline" --baseline-commit "$(git rev-parse HEAD^)" --proof-output "$RUNNER_TEMP/postgres-candidate-proof.json"
  preview-package:
    name: PR preview package
    needs: [quality, coverage, verify, verify-selfhost, verify-browser, scope]
    # Required final gate: even a canceled/failed scope or dependency must
    # explicitly fail here, rather than turn every remaining status into skipped.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every exact-run prerequisite
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          APPLICATION_RESULT: ${{ needs.verify.result }}
          NATIVE_RESULT: ${{ needs.verify-selfhost.result }}
          BROWSER_RESULT: ${{ needs.verify-browser.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$APPLICATION_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$BROWSER_RESULT" = success
      # Same read-only job for internal, fork and Dependabot PRs. Generated
      # credentials/reports are never copied from a verification runner.
      # This artifact has passed PR checks, not full Auth/browser/native acceptance.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the committed, tested application source
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PROFILE: ${{ needs.scope.outputs.profile }}
        run: node scripts/pr-preview-package.mjs "$RUNNER_TEMP/pr-preview"
      - name: Upload runnable local PR preview
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-pr-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Explain the local preview
        env:
          ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo '### Runnable local PR preview'
            echo
            echo "[Download preview package]($ARTIFACT_URL). This is a complete local application source package, not a hosted website."
            echo
            echo 'Review the contributor source, unpack portal-source.tar.gz and run node preview.mjs start on Linux with Node and Docker. This wrapper uses separate data volumes and ports. Read README.txt and portal/README.md first.'
          } >> "$GITHUB_STEP_SUMMARY"
  release-cms:
    # Explicit development release with an immutable commit tag. Main pushes,
    # ordinary verification and daily maintenance cannot enable this gate.
    # The exact reviewed SHA still passes every application gate in this run.
    name: Publish tested CMS update
    # Share the publication lock with automatic releases for the same SHA.
    concurrency:
      group: cms-release-${{ github.sha }}
      cancel-in-progress: false
    needs: [quality, coverage, verify, verify-selfhost, verify-browser]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main' && inputs.expected_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Confirm explicit exact-revision publication request
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          test "$PUBLISH_RELEASE" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test -n "$EXPECTED_COMMIT"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Build public frontend and verified release package
        env:
          VITE_SUPABASE_URL: ${{ vars.CMS_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CMS_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          # The exact same-run Typecheck gate already passed before this release job.
          npx vite build
          node deploy/hostinger/updates/package.mjs --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/cms-release"
      - name: Publish immutable update after verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Luminovia-Training-Consulting/Luminovia-Management-Tool
        run: |
          set -euo pipefail
          RELEASE_TAG="cms-dev-$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/cms-existing-release.json" 2>/dev/null; then
            if test "$(jq -r .isDraft "$RUNNER_TEMP/cms-existing-release.json")" = false; then
              echo "The immutable release is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "CMS development $GITHUB_SHA" --notes "Explicitly published from this successfully verified main commit."
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/cms-release/cms-release.tar.gz" "$RUNNER_TEMP/cms-release/cms-release.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
