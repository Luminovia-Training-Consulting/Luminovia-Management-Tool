# Dedicated public API surface and rate limit. Private services use api-gw directly.
static_resources:
  listeners:
    - name: academy-api-ingress
      per_connection_buffer_limit_bytes: 32768
      address:
        socket_address: { address: 0.0.0.0, port_value: 8001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: academy_api_ingress
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: academy_api
                  virtual_hosts:
                    - name: dedicated_gateway
                      domains: ["*"]
                      routes:
                        - match:
                            { path: "/functions/v1/accounts/v1/academy/users" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match:
                            {
                              path: "/functions/v1/accounts/v1/academy/company-invitations",
                            }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        # The template fixes the route structure. The short
                        # regex validates the UUID within Envoy's RE2 budget.
                        - match:
                            path_match_policy:
                              name: envoy.path.match.uri_template
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.path.match.uri_template.v3.UriTemplateMatchConfig
                                path_template: /functions/v1/accounts/v1/academy/invitations/{id=*}/retry
                            headers:
                              - name: ":path"
                                string_match:
                                  safe_regex:
                                    regex: ".*/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/retry"
                              - name: ":method"
                                string_match:
                                  safe_regex: { regex: "POST|OPTIONS" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { path: "/functions/v1/company-integration" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match:
                            {
                              path: "/functions/v1/company-integration/enrolments",
                            }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match:
                            {
                              path: "/functions/v1/company-integration/participation",
                            }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { path: "/functions/v1/course-documents" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match:
                            path: "/functions/v1/learning-lti"
                            headers:
                              - name: ":method"
                                string_match:
                                  safe_regex: { regex: "POST|OPTIONS" }
                          route: { cluster: academy-api-gateway, timeout: 15s }
                        - match:
                            path: "/functions/v1/learning-lti/jwks"
                            headers:
                              - name: ":method"
                                string_match: { exact: "GET" }
                          route: { cluster: academy-api-gateway, timeout: 15s }
                        - match:
                            path: "/functions/v1/learning-lti/token"
                            headers:
                              - name: ":method"
                                string_match: { exact: "POST" }
                          route: { cluster: academy-api-gateway, timeout: 15s }
                        - match:
                            safe_regex:
                              regex: /functions/v1/learning-lti/memberships/[0-9a-f-]+
                            headers:
                              - name: ":method"
                                string_match: { exact: "GET" }
                          route: { cluster: academy-api-gateway, timeout: 15s }
                        - match:
                            safe_regex:
                              regex: /functions/v1/portal-api/v1/[a-z][a-z0-9_]*
                            headers:
                              - name: ":method"
                                string_match:
                                  safe_regex:
                                    regex: GET|PUT|PATCH|DELETE|OPTIONS
                          route: { cluster: academy-api-gateway, timeout: 35s }
                        - match:
                            path: "/functions/v1/files"
                            query_parameters:
                              - name: mode
                                string_match:
                                  safe_regex:
                                    {
                                      regex: "(?:academy-(?:material|student-exam|course-chat|attendance|answer-key|logo)|course-submission|exam-submission)",
                                    }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match:
                            path: "/functions/v1/files"
                            query_parameters:
                              - name: mode
                                string_match:
                                  safe_regex:
                                    {
                                      regex: "academy-pwa-(?:icon|manifest|image)",
                                    }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { path: "/functions/v1/human-login" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { path: "/functions/v1/human-recovery" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { path: "/functions/v1/mail-admin" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { path_separated_prefix: "/auth/v1/admin" }
                          direct_response: { status: 404 }
                        - match: { prefix: "/auth/v1/" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { prefix: "/rest/v1/rpc/" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { path: "/realtime/v1/websocket" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                        - match: { prefix: "/" }
                          direct_response: { status: 404 }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: academy_licence
                      token_bucket:
                        max_tokens: ACADEMY_SIGNED_API_REQUESTS_PER_MINUTE
                        tokens_per_fill: ACADEMY_SIGNED_API_REQUESTS_PER_MINUTE
                        fill_interval: 60s
                      filter_enabled:
                        {
                          default_value:
                            { numerator: 100, denominator: HUNDRED },
                        }
                      filter_enforced:
                        {
                          default_value:
                            { numerator: 100, denominator: HUNDRED },
                        }
                      response_headers_to_add:
                        - header: { key: retry-after, value: "60" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: academy-api-gateway
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: academy-api-gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api-gw, port_value: 8000 }
