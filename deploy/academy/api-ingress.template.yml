# Dedicated public API limit. Internal service traffic uses api-gw directly.
static_resources:
  listeners:
    - name: academy-api-ingress
      per_connection_buffer_limit_bytes: 32768
      address:
        socket_address: { address: 0.0.0.0, port_value: 8001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: academy_api_ingress
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: academy_api
                  virtual_hosts:
                    - name: dedicated_gateway
                      domains: ['*']
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: academy-api-gateway, timeout: 150s }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: academy_licence
                      token_bucket:
                        max_tokens: ACADEMY_SIGNED_API_REQUESTS_PER_MINUTE
                        tokens_per_fill: ACADEMY_SIGNED_API_REQUESTS_PER_MINUTE
                        fill_interval: 60s
                      filter_enabled: { default_value: { numerator: 100, denominator: HUNDRED } }
                      filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
                      response_headers_to_add:
                        - header: { key: retry-after, value: "60" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: academy-api-gateway
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: academy-api-gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api-gw, port_value: 8000 }
