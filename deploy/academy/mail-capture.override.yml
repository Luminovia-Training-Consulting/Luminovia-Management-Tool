# Load only for an isolated Auth mail rehearsal. Mailpit has no external
# listener. Empty template URLs keep capture independent of public ingress.
services:
  auth:
    environment:
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_MAILER_TEMPLATES_INVITE: ""
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ""
      GOTRUE_MAILER_TEMPLATES_MFA_FACTOR_ENROLLED_NOTIFICATION: ""
      GOTRUE_MAILER_TEMPLATES_MFA_FACTOR_UNENROLLED_NOTIFICATION: ""
    depends_on:
      mailpit:
        condition: service_healthy
