# Load only for an isolated invitation/recovery rehearsal. Mailpit has no
# external listener. GoTrue sends into it without using a customer provider.
services:
  auth:
    environment:
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_MAILER_TEMPLATES_INVITE: ""
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ""
    depends_on:
      mailpit:
        condition: service_healthy
