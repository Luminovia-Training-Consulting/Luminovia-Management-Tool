# Self-host backend with private persistent mounts. Public ingress goes through Caddy/gateway; this file alone does not establish production or capacity acceptance.
# DEVELOPMENT/SETUP ONLY on purchased KVM1: no production or100GB capacity acceptance.
# Derived from official self-hosted/v0.8.4; digest pinned. Mailpit and relay SMTP ports bind host LOOPBACK only.
name: luminovia-supabase
services:
  # Share only Auth’s network namespace so SMTP credentials and tokens travel
  # over its loopback. The relay keeps its own process, volumes and privileges.
  mail-relay:
    image: python:3.13.11-slim-bookworm@sha256:20080e807bfc404f8450b185cf0fc95d553462673598549613735f70a5b4d5d0
    restart: unless-stopped
    user: "10001:10001"
    working_dir: /app
    command: [ "python", "-I", "/app/mail-relay.py", "--serve" ]
    environment:
      PORTAL_MAIL_RELAY_API_URL: http://api-gw:8000/rest/v1
      PORTAL_MAIL_RELAY_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY}
      PORTAL_MAIL_RELAY_USERNAME: ${MAIL_RELAY_USERNAME:?Set MAIL_RELAY_USERNAME}
      PORTAL_MAIL_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:?Set MAIL_RELAY_PASSWORD}
      PORTAL_MAIL_RELAY_CONTROL_TOKEN: ${PORTAL_MAIL_RELAY_CONTROL_TOKEN:?Set PORTAL_MAIL_RELAY_CONTROL_TOKEN}
      PORTAL_MAIL_RELAY_CAPTURE_PENDING: ${PORTAL_MAIL_RELAY_CAPTURE_PENDING:-false}
    network_mode: service:auth
    volumes:
      - ../../../scripts/mail-relay.py:/app/mail-relay.py:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -I
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
  # Transactional source with persistent PGDATA and a separate configuration volume.
  db:
    image: supabase/postgres:17.12.0.000@sha256:8630950b489ecc70563300180287a98c192a4a48f5ae00b4febdaeea1abe85de
    restart: unless-stopped
    volumes:
      - ../supabase/upstream/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ../supabase/upstream/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ../supabase/upstream/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ../supabase/upstream/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ${PORTAL_DATA_DIR:?Set PORTAL_DATA_DIR}/postgres:/var/lib/postgresql/data
      - ../supabase/upstream/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ../supabase/upstream/volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ../supabase/upstream/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -h localhost || exit 1;
          if [ ! -f /tmp/portal-administration-schedule ]; then
            if psql -wXqAt -U supabase_admin -c 'select private.ensure_administration_activity_schedule()' 2>/dev/null | grep -qx t; then
              touch /tmp/portal-administration-schedule;
            fi;
          fi
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
    networks:
      - backend
    mem_limit: 384m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
  # Native invitation/password sign-in with operator-enabled TOTP transport.
  # The separate PostgreSQL policy decides which roles must verify a factor.
  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9999/health
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 60s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:2526:2526"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      LOG_LEVEL: warn
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: "127.0.0.1"
      GOTRUE_SMTP_PORT: ${PORTAL_AUTH_SMTP_PORT:-${SMTP_PORT}}
      GOTRUE_SMTP_USER: ${PORTAL_AUTH_SMTP_USER:-${SMTP_USER}}
      GOTRUE_SMTP_PASS: ${PORTAL_AUTH_SMTP_PASS:-${SMTP_PASS}}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: ${PORTAL_TOTP_ENABLED:-false}
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: ${PORTAL_TOTP_ENABLED:-false}
      GOTRUE_MFA_PHONE_ENROLL_ENABLED: "false"
      GOTRUE_MFA_PHONE_VERIFY_ENABLED: "false"
      GOTRUE_MFA_WEB_AUTHN_ENROLL_ENABLED: "false"
      GOTRUE_MFA_WEB_AUTHN_VERIFY_ENABLED: "false"
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?Set JWT_KEYS}
      GOTRUE_DB_MAX_POOL_SIZE: "5"
      GOTRUE_DB_MAX_IDLE_POOL_SIZE: "2"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SESSIONS_SINGLE_PER_USER: "false"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ:abcdefghijklmnopqrstuvwxyz:0123456789:!@#$%^&*()_+-=[]{}|;\:,.<>?/'
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "20"
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_MAILER_TEMPLATES_INVITE: ${PORTAL_MAIL_TEMPLATE_ORIGIN:?Set PORTAL_MAIL_TEMPLATE_ORIGIN}/mail-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${PORTAL_MAIL_TEMPLATE_ORIGIN:?Set PORTAL_MAIL_TEMPLATE_ORIGIN}/mail-templates/recovery.html
      GOTRUE_MAILER_SUBJECTS_INVITE: "Luminovia Portal: Deine Einladung / Your invitation"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Luminovia Portal: Passwort zur\xFCcksetzen / Reset password"
      # GoTrue sends account-change notices through the same SMTP credentials as recovery.
      GOTRUE_MAILER_NOTIFICATIONS_MFA_FACTOR_ENROLLED_ENABLED: ${PORTAL_TOTP_SECURITY_MAIL_ENABLED:-false}
      GOTRUE_MAILER_NOTIFICATIONS_MFA_FACTOR_UNENROLLED_ENABLED: ${PORTAL_TOTP_SECURITY_MAIL_ENABLED:-false}
      GOTRUE_MAILER_TEMPLATES_MFA_FACTOR_ENROLLED_NOTIFICATION: ${PORTAL_MAIL_TEMPLATE_ORIGIN:?Set PORTAL_MAIL_TEMPLATE_ORIGIN}/mail-templates/authenticator-enrolled.html
      GOTRUE_MAILER_TEMPLATES_MFA_FACTOR_UNENROLLED_NOTIFICATION: ${PORTAL_MAIL_TEMPLATE_ORIGIN:?Set PORTAL_MAIL_TEMPLATE_ORIGIN}/mail-templates/authenticator-unenrolled.html
      GOTRUE_MAILER_SUBJECTS_MFA_FACTOR_ENROLLED_NOTIFICATION: "Authenticator hinzugefügt / Authenticator added"
      GOTRUE_MAILER_SUBJECTS_MFA_FACTOR_UNENROLLED_NOTIFICATION: "Authenticator entfernt / Authenticator removed"
    networks:
      backend:
        aliases: [mail-relay]
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
  # RLS/GRANT-bound Data API; a row cap does not replace server-side pagination.
  rest:
    image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - postgrest
        - --ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      PGRST_DB_POOL: "5"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "30"
    command:
      - postgrest
    networks:
      backend:
        aliases: [mail-relay]
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
  # Persisted Realtime channels remain subject to current database and membership rules.
  realtime:
    image: supabase/realtime:v2.161.0@sha256:f5c0e0f330b8eb4d0d74b2f795d1f8e4bc9523fc9dc7ceb684a1968fc57cf414
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${ANON_KEY}" http://localhost:4000/api/tenants/realtime-dev/health'
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
      API_JWT_JWKS: ${JWT_JWKS:?Set JWT_JWKS}
      DB_POOL_SIZE: "2"
      DB_REPLICA_POOL_SIZE: "2"
      ERL_FLAGS: +S 1:1
    networks:
      backend:
        aliases:
          - realtime-dev.supabase-realtime
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    hostname: realtime-dev.supabase-realtime
  # Private object bytes in a separate persistent file mount.
  storage:
    image: supabase/storage-api:v1.95.0@sha256:833558845aafcfd493c33a4258cc8def1a7c6b3c20dd3b35aacfd2d89aa79558
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://storage:5000/status
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "104857600"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
      JWT_JWKS: ${JWT_JWKS:?Set JWT_JWKS}
      DATABASE_MAX_CONNECTIONS: "5"
    volumes:
      - ${PORTAL_DATA_DIR:?Set PORTAL_DATA_DIR}/storage:/var/lib/storage
    networks:
      - backend
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
  # Portal Edge handlers use user JWTs for business permissions and separate server-only keys.
  functions:
    image: supabase/edge-runtime:v1.79.1@sha256:185b4039d8e8ffe0a3a41b425bd299a51100a590d04e05aa4c2be1d66d09cb5d
    mem_limit: ${PORTAL_FUNCTIONS_MEMORY_LIMIT:-1280m}
    restart: unless-stopped
    volumes:
      - ./runtime:/home/deno/functions/main:ro
      - ../supabase/upstream/volumes/functions/deno.jsonc:/home/deno/functions/deno.jsonc:ro
      - ../../../supabase/functions/_shared:/home/deno/functions/_shared:ro
      - ../../../supabase/functions/files:/home/deno/functions/files:ro
      - ../../../supabase/functions/mail-admin:/home/deno/functions/mail-admin:ro
      - ../../../supabase/functions/invite-lecturer:/home/deno/functions/invite-lecturer:ro
      - ../../../supabase/functions/accounts:/home/deno/functions/accounts:ro
      # Reviewed integration worker only; this adds no listener or separate service.
      - ../../../supabase/functions/website-enquiries:/home/deno/functions/website-enquiries:ro
      - ../../../supabase/functions/course-documents:/home/deno/functions/course-documents:ro
      - ../../../supabase/functions/learning-lti:/home/deno/functions/learning-lti:ro
      - ../../../supabase/functions/calendar-feed:/home/deno/functions/calendar-feed:ro
      - ../../../supabase/functions/human-login:/home/deno/functions/human-login:ro
      - ../../../supabase/functions/human-recovery:/home/deno/functions/human-recovery:ro
      - ../../../supabase/functions/company-integration:/home/deno/functions/company-integration:ro
      - ../../../supabase/functions/portal-api:/home/deno/functions/portal-api:ro
      - deno-cache:/root/.cache/deno
    depends_on:
      api-gw:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PORTAL_MAIL_RELAY_URL: ${PORTAL_MAIL_RELAY_URL}
      PORTAL_MAIL_RELAY_CONTROL_TOKEN: ${PORTAL_MAIL_RELAY_CONTROL_TOKEN}
      SUPABASE_PUBLISHABLE_KEYS: '{"default":"${SUPABASE_PUBLISHABLE_KEY:-}"}'
      SUPABASE_SECRET_KEYS: '{"default":"${SUPABASE_SECRET_KEY:-}"}'
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      VERIFY_JWT: "true"
      SUPABASE_JWKS: ${JWT_JWKS:?Set JWT_JWKS}
      PORTAL_APP_ORIGIN: ${PORTAL_APP_ORIGIN:?Set PORTAL_APP_ORIGIN}
      PORTAL_ALLOWED_ORIGINS: ${PORTAL_APP_ORIGIN:?Set PORTAL_APP_ORIGIN}
      LTI_PLATFORM_ISSUER: ${LTI_PLATFORM_ISSUER:-}
      LTI_PLATFORM_RSA_PRIVATE_JWK: ${LTI_PLATFORM_RSA_PRIVATE_JWK:-}
      PORTAL_INVITES_ENABLED: ${PORTAL_INVITES_ENABLED:-false}
      PORTAL_WEBSITE_ENQUIRIES_ENABLED: ${PORTAL_WEBSITE_ENQUIRIES_ENABLED:-false}
      # Keep both credentials/config server-side; missing configuration stays disabled.
      PORTAL_WEBSITE_ORIGIN: ${PORTAL_WEBSITE_ORIGIN:-}
      PORTAL_WEBSITE_PRIVACY_NOTICE_VERSION: ${PORTAL_WEBSITE_PRIVACY_NOTICE_VERSION:-}
      PORTAL_WEBSITE_INTEGRATION_TOKEN: ${PORTAL_WEBSITE_INTEGRATION_TOKEN:-}
      PORTAL_CLAMAV_HOST: clamav
      PORTAL_CLAMAV_PORT: "3310"
      DENO_TLS_CA_STORE: mozilla,system
      EDGE_RUNTIME_WORKER_POOL_SIZE: "1"
    command:
      - start
      - --user-worker-request-idle-timeout
      - "150000"
      - --main-service
      - /home/deno/functions/main
    networks:
      - backend
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
  # Private API-key/routing boundary forwards only approved application services.
  api-gw:
    image: envoyproxy/envoy:v1.40.2@sha256:8de97e654644827d62afdbf7e1d3dc9fee01a8690d410dd1c63a30dc6b6cecbb
    restart: unless-stopped
    networks:
      backend:
        aliases:
          - api-gw
          - envoy
          - kong
          - api
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ../supabase/upstream/volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ../supabase/upstream/volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint:
      - /bin/sh
      - /docker-entrypoint.sh
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
  # Development mail sink with persistent test messages; no delivery to real recipients.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    networks:
      - backend
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - ${PORTAL_DATA_DIR:?Set PORTAL_DATA_DIR}/mailpit:/data
    ports:
      - 127.0.0.1:8025:8025
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    mem_limit: 64m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  backend:
    external: true
    name: ${PORTAL_BACKEND_NETWORK:-luminovia-portal-backend}
volumes:
  db-config: null
  deno-cache: null
