# Development Caddy ingress and private ClamAV use digest-pinned images. Only Caddy publishes host ports; backend connectivity uses the explicit existing network.
name: luminovia-portal
services:
  web:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set the approved portal domain}
      PORTAL_LTI_TOOL_ORIGINS: ${PORTAL_LTI_TOOL_ORIGINS:-'self'}
      PORTAL_SCORM_RUNTIME_DOMAIN: ${PORTAL_SCORM_RUNTIME_DOMAIN:-scorm-disabled.invalid}
      PORTAL_H5P_RUNTIME_DOMAIN: ${PORTAL_H5P_RUNTIME_DOMAIN:-h5p-disabled.invalid}
      PORTAL_CADDY_ALIAS_PROFILE: cms_legacy_aliases
      PORTAL_CADDY_RESET_PROFILE: cms_hosted_reset
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PORTAL_WWW_DIR:-/opt/luminovia-portal/www}:/srv:ro
      - ./mail-templates:/mail-templates:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ backend ]
    mem_limit: 128m
    pids_limit: 100
    security_opt: [ "no-new-privileges:true" ]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
  clamav:
    image: clamav/clamav@sha256:12177441d1b40cef3c47b44c4090d59d4babc4c67bedd5af0fa315e603aa6dd8
    restart: unless-stopped
    environment:
      CLAMD_STARTUP_TIMEOUT: "180"
      # Native clamd VERSION timestamps omit a zone; the shared validator reads UTC.
      TZ: UTC
    volumes:
      - clamav_signatures:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    networks: [ backend ]
    # Private TCP only. No Docker/host port is published for ClamAV.
    mem_limit: 3g
    pids_limit: 100
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ CMD, clamdscan, --config-file=/etc/clamav/clamd.conf, --ping=1 ]
      interval: 30s
      timeout: 5s
      start_period: 180s
      start_interval: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  backend:
    external: true
    name: luminovia-portal-backend
volumes:
  caddy_data:
  caddy_config:
  clamav_signatures:
