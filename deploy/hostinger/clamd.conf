# Begrenzte ClamAV-Konfiguration für untrusted Portaldateien. TCP ist ausschließlich im privaten Compose-Netz erreichbar; Größen-/Rekursionsgrenzen und ein einzelner Scanworker begrenzen Ressourcen.
Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
LogTime yes
StreamMaxLength 100M
MaxScanSize 300M
MaxFileSize 100M
MaxRecursion 10
MaxFiles 1000
MaxThreads 1
ConcurrentDatabaseReload no
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
HeuristicAlerts yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanXMLDOCS yes
