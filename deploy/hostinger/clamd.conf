# Bounded ClamAV configuration for untrusted portal files. TCP is confined to the private Compose network; size/recursion limits and one scan worker bound resource use.
Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
LogTime yes
StreamMaxLength 100M
MaxScanSize 300M
MaxFileSize 100M
MaxRecursion 10
MaxFiles 1000
MaxThreads 1
ConcurrentDatabaseReload no
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
HeuristicAlerts yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanXMLDOCS yes
